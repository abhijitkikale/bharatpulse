<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BharatPulse Live GEX and Volume</title>
<style>
:root{--bg:#0b0f16;--card:#111823;--line:#263040;--txt:#e6edf3;--mut:#8b97a8;--pos:#2ecc9a;--neg:#ef5b5b;
  --lw:clamp(310px,25vw,500px);--fs:clamp(13px,0.95vw,20px);--px:#1a2432}
:root[data-theme=light]{--bg:#ffffff;--card:#f3f5f8;--line:#d5dbe4;--txt:#111827;--mut:#5b6678;--pos:#0f8a5f;--neg:#d33f3f;--px:#e6ebf3}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,"Segoe UI",Arial,sans-serif;overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100vh}
.ban{flex:none;height:calc(var(--fs)*2.2);background:#3a2a05;color:#ffd27a;font-weight:700;font-size:calc(var(--fs)*1.1);overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.ban span{display:inline-block;padding-left:100%;animation:mq 60s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.hd{flex:none;display:flex;align-items:baseline;gap:calc(var(--fs)*1.2);padding:calc(var(--fs)*.35) calc(var(--fs)*1);border-bottom:1px solid var(--line)}
.hd .t{font-size:calc(var(--fs)*1.6);font-weight:700}.hd .p{font-size:calc(var(--fs)*2);font-weight:700}.hd .m{color:var(--mut);font-size:calc(var(--fs)*1)}
.chip{margin-left:auto;font-size:calc(var(--fs)*1.05);padding:3px 12px;border-radius:12px;border:1px solid var(--line);color:var(--mut)}
.chip.btn{cursor:pointer;margin-left:10px;color:var(--txt)}
.chip.ok{color:var(--pos);border-color:var(--pos)}.chip.bad{color:var(--neg);border-color:var(--neg)}
.tr{flex:none;padding:calc(var(--fs)*.3) calc(var(--fs)*1);border-bottom:1px solid var(--line);font-size:calc(var(--fs)*1.15);font-weight:700;display:flex;gap:calc(var(--fs)*1.6);align-items:baseline;flex-wrap:wrap}
.tr.win{background:rgba(46,204,154,.16)}.tr.loss{background:rgba(239,91,91,.16)}.tr .k{color:var(--mut);font-weight:500;font-size:calc(var(--fs)*.85);margin-right:4px}.tr .big{font-size:calc(var(--fs)*1.5)}
.body{flex:1;display:flex;min-height:0}
.left{flex:none;width:var(--lw);box-sizing:border-box;border-right:1px solid var(--line);padding:calc(var(--fs)*.5);display:flex;flex-direction:column;gap:calc(var(--fs)*.5);overflow:hidden}
.main{flex:1;position:relative;min-width:0}
#cd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:calc(var(--fs)*1) calc(var(--fs)*3);display:none;box-shadow:0 8px 40px rgba(0,0,0,.25);pointer-events:none}
#cd .a{font-size:calc(var(--fs)*1.5);color:var(--mut);font-weight:600}#cd .t{font-size:calc(var(--fs)*5);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}#cd .b{font-size:calc(var(--fs)*1.05);color:var(--mut);margin-top:calc(var(--fs)*.3)}
#chart{position:absolute;left:0;top:0;right:0;bottom:0}
#regime{display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:calc(var(--fs)*.3) calc(var(--fs)*.8);font-size:calc(var(--fs)*1.35);font-weight:700;line-height:1.3}
.sg{flex:none;display:none;gap:calc(var(--fs)*.6);align-items:center;flex-wrap:wrap;padding:calc(var(--fs)*.25) calc(var(--fs)*1);border-bottom:1px solid var(--line);font-size:calc(var(--fs)*.92)}
.sg .h{color:var(--mut);font-weight:500}.sg .c{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 8px;white-space:nowrap}
#lv{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;font-size:calc(var(--fs)*.98)}
.row{display:flex;align-items:center;gap:6px;border-left:4px solid;padding:0 6px;font-weight:700;line-height:1.28;white-space:nowrap}
.row .n{flex:1;overflow:hidden;text-overflow:ellipsis}.row .v{font-variant-numeric:tabular-nums}.row .d{width:4.6em;text-align:right;font-weight:500;color:var(--mut);font-variant-numeric:tabular-nums}
.row.px{background:var(--px);border-left-color:var(--txt);color:var(--txt)}
</style>
</head>
<body>
<div class="wrap">
  <div class="ban"><span id="b1"></span></div>
  <div class="hd"><span class="t">NIFTY 50 · 1 min</span><span class="p" id="px">–</span><span class="m" id="meta"></span><span class="chip" id="chip">connecting…</span><span class="chip btn" id="th" title="Light / dark background">☀ Light</span></div>
  <div class="tr" id="trade" style="display:none"></div>
  <div class="sg" id="setups" style="display:none"></div>
  <div class="body">
    <div class="left"><div id="regime"><div id="r1"></div><div id="r2"></div></div><div id="lv"></div></div>
    <div class="main"><div id="chart"></div><div id="cd"><div class="a" id="cd-a"></div><div class="t" id="cd-t"></div><div class="b" id="cd-b"></div></div></div>
  </div>
  <div class="ban"><span id="b2"></span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const TXT='NOT SEBI REGISTERED  ·  THIS IS NOT FINANCIAL ADVICE OR A RECOMMENDATION TO BUY OR SELL  ·  Gamma exposure (GEX) and volume-profile data shown for education only, so the numbers can be read and interpreted by each viewer  ·  Data may be delayed or wrong  ·  Trade at your own risk and consult a SEBI-registered adviser  ·  ';
document.getElementById('b1').textContent=TXT+TXT;document.getElementById('b2').textContent=TXT+TXT;

const qs=new URLSearchParams(location.search);
let THEME=qs.get('theme')||(()=>{try{return localStorage.getItem('bp_theme')}catch(e){return null}})()||'light';if(THEME!=='dark')THEME='light';
const LIGHT={'#ffeb3b':'#c79100','#18ffff':'#0097a7','#ff80ab':'#d81b60','#80cbc4':'#00796b','#d4e157':'#827717','#f5a623':'#e65100','#ef5b5b':'#c62828','#2ecc9a':'#2e7d32','#ff9f6b':'#e64a19','#66c2ff':'#0277bd','#e8c547':'#b8860b','#b388ff':'#6a1b9a'};
const G=()=>THEME==='light'?'#0f8a5f':'#2ecc9a',R=()=>THEME==='light'?'#d33f3f':'#ef5b5b';
const el=document.getElementById('chart');
const axisFont=()=>Math.round(Math.max(13,window.innerWidth*0.0098));
const chart=LightweightCharts.createChart(el,{layout:{background:{color:'#0b0f16'},textColor:'#c9d1d9',fontSize:axisFont()},grid:{vertLines:{color:'#141c28'},horzLines:{color:'#141c28'}},
  rightPriceScale:{borderColor:'#263040',scaleMargins:{top:0.03,bottom:0.03}},timeScale:{borderColor:'#263040',timeVisible:true,secondsVisible:false,rightOffset:6},crosshair:{mode:0},handleScroll:false,handleScale:false,autoSize:true});
const cs=chart.addCandlestickSeries({upColor:'#2ecc9a',downColor:'#ef5b5b',borderVisible:false,wickUpColor:'#2ecc9a',wickDownColor:'#ef5b5b'});
const vd=chart.addLineSeries({color:'#18ffff',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,autoscaleInfoProvider:()=>null});
const vw=chart.addLineSeries({color:'#ffeb3b',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,autoscaleInfoProvider:()=>null});
const CLEAN=new URLSearchParams(location.search).get('clean')==='1';if(CLEAN)document.getElementById('th').style.display='none';   // /?clean=1 : no setups table or CALL / PUT markers (for OBS)
let lines=[],RANGE=null,LASTS=null;
function applyTheme(){
  const L=THEME==='light';document.documentElement.dataset.theme=THEME;
  chart.applyOptions({layout:{background:{color:L?'#ffffff':'#0b0f16'},textColor:L?'#1f2937':'#c9d1d9'},grid:{vertLines:{color:L?'#eef1f5':'#141c28'},horzLines:{color:L?'#eef1f5':'#141c28'}},
    rightPriceScale:{borderColor:L?'#c9d1dc':'#263040'},timeScale:{borderColor:L?'#c9d1dc':'#263040'}});
  cs.applyOptions({upColor:G(),downColor:R(),wickUpColor:G(),wickDownColor:R()});
  vd.applyOptions({color:color({name:'Now VWAP',kind:'now'})});vw.applyOptions({color:color({name:'Now Weekly VWAP',kind:'now'})});
  document.getElementById('th').textContent=L?'☀ Light':'☾ Dark';
}
document.getElementById('th').onclick=()=>{THEME=THEME==='light'?'dark':'light';try{localStorage.setItem('bp_theme',THEME)}catch(e){}applyTheme();if(LASTS)draw(LASTS)};

// the price axis follows the day's high and low only, so the candles fill the screen; every level is listed in the table on the left
function dayRange(s){
  const day=s.date,c_=s.candles.filter(c=>new Date(c.time*1000).toISOString().slice(0,10)===day);
  const arr=c_.length?c_:s.candles,lo=Math.min(...arr.map(c=>c.low)),hi=Math.max(...arr.map(c=>c.high)),pad=0.03*Math.max(hi-lo,1);
  return {lo:lo-pad,hi:hi+pad}}
cs.applyOptions({autoscaleInfoProvider:()=>RANGE?{priceRange:{minValue:RANGE.lo,maxValue:RANGE.hi}}:null});

// colours and line styles by level name (same scheme as the TradingView indicator)
function color(l){const c=baseColor(l);return THEME==='light'?(LIGHT[c]||c):c}
function baseColor(l){const s=l.name.toLowerCase();
  if(s==='now weekly vwap')return '#ffeb3b';
  if(l.kind==='live'||l.kind==='now')return '#18ffff';
  if(s.includes('weekly')&&s.includes('poc'))return '#ff80ab';
  if(s.includes('weekly'))return '#80cbc4';
  if(s.includes('max pain'))return '#d4e157';if(s.includes('flip'))return '#f5a623';
  if(s.includes('oi call'))return '#ef5b5b';if(s.includes('oi put'))return '#2ecc9a';
  if(s.includes('gex call'))return '#ff9f6b';if(s.includes('gex put'))return '#66c2ff';
  if(s.includes('poc'))return '#e8c547';return '#b388ff'}
function style(l){const s=l.name.toLowerCase();
  if(s.includes('poc'))return 0;if(s.includes('weekly'))return 1;if(s.includes('max pain')||s.includes('flip'))return 1;return 2}

function renderLevels(s){
  const t=s.regime&&s.regime.now_time,rows=(s.levels||[]).slice();
  rows.push({name:'PRICE',value:s.last,kind:'px'});
  rows.sort((a,b)=>b.value-a.value);
  document.getElementById('lv').innerHTML=rows.map(l=>{
    if(l.kind==='px')return `<div class="row px"><span class="n">▶ Price</span><span class="v">${l.value.toFixed(2)}</span><span class="d"></span></div>`;
    const d=l.value-s.last,c=color(l),tag=l.kind==='live'&&t?` <span style="color:var(--mut);font-weight:500">${t}</span>`:'';
    return `<div class="row" style="border-left-color:${c};color:${c}"><span class="n">${l.name}${tag}</span><span class="v">${l.value.toFixed(2)}</span><span class="d">${d>0?'+':''}${d.toFixed(0)}</span></div>`}).join('');
}
function draw(s){
  LASTS=s;
  const LV=s.levels||[];
  const ok=s.candles&&s.candles.length;
  document.getElementById('px').textContent=ok?s.last.toFixed(2):'–';
  const age=s.asof?(Date.now()-Date.parse(s.asof))/1000:1e9;
  const chip=document.getElementById('chip');
  const live=s.status==='live';
  chip.textContent=live?(age>120?'DATA STALE':'LIVE · candle '+s.last_candle+' IST'):(s.status||'waiting');
  chip.className='chip '+(live&&age<=120?'ok':(live?'bad':''));
  document.getElementById('meta').textContent=(s.eod_close?'end-of-day levels from the '+s.eod_close+' close':'')+(s.replay_eod?' · today\'s trades use the levels of the '+s.replay_eod+' close':'')+(s.open_src?' · opening candles: TradingView ('+s.open_src+')':'');
  if(!ok)return;
  RANGE=dayRange(s);
  cs.setData(s.candles);vd.setData(s.vwap.daily);vw.setData(s.vwap.weekly);
  lines.forEach(p=>cs.removePriceLine(p));
  lines=LV.map(l=>cs.createPriceLine({price:l.value,color:color(l),lineWidth:l.kind==='eod'?1:2,lineStyle:style(l),axisLabelVisible:false,title:''}));
  // today's candles, with only a few of the day before, so they fill the width
  const day=s.date;let i0=s.candles.findIndex(c=>new Date(c.time*1000).toISOString().slice(0,10)===day);if(i0<0)i0=0;
  chart.timeScale().setVisibleLogicalRange({from:Math.max(i0-3,0),to:s.candles.length+8});
  chart.priceScale('right').applyOptions({autoScale:true});
  // regime box
  const r=s.regime||{},box=document.getElementById('regime');
  const col=v=>v==='POSITIVE'?G():R();
  if(r.eod||r.now){box.style.display='block';
    document.getElementById('r1').innerHTML=r.eod?`<span style="color:${col(r.eod)}">EOD: ${r.eod} gamma</span>`:'';
    document.getElementById('r2').innerHTML=r.now?`<span style="color:${col(r.now)}">NOW: ${r.now} gamma${r.now_time?' ('+r.now_time+')':''}</span>`:''}
  else box.style.display='none';
  // CALL / PUT setups (not shown on the clean address)
  const sb=document.getElementById('setups'),st=s.setups||{table:[],markers:[]};
  const T=s.trades,tb=document.getElementById('trade');
  if(CLEAN){sb.style.display='none';cs.setMarkers([]);tb.style.display='none'}
  else{
    sb.style.display='flex';
    const cc=x=>x.side==='CALL'?G():R();
    const sigs=T?T.signals.slice().reverse().slice(0,4):null;
    const stc=x=>x.status.startsWith('TRADE')?'font-weight:700':'color:#8b97a8';
    const chip=x=>`<span class="c"><span style="color:${cc(x)};font-weight:700">${x.side} ${x.strike}</span> · ${x.when} · ${x.level} <span style="${x.status?stc(x):''}">→ ${x.status||''}</span></span>`;
    sb.innerHTML='<span class="h">Setups</span>'+(T&&sigs.length?sigs.slice(0,4).map(chip).join(''):(st.table.length?st.table.slice(0,3).map(x=>chip({side:x.side,strike:x.strike,when:x.when.slice(7),level:x.level,status:''})).join(''):'<span class="h">none yet</span>'));
    // markers: trade entries and exits are bold, other setups are small and grey
    let mk=[];
    if(T){
      T.signals.filter(x=>!x.status.startsWith('TRADE')).forEach(x=>mk.push({time:x.time,position:x.side==='CALL'?'belowBar':'aboveBar',color:'#8b97a8',shape:x.side==='CALL'?'arrowUp':'arrowDown',text:''}));
      T.markers.forEach(m=>mk.push(m.kind==='entry'?{time:m.time,position:m.side==='CALL'?'belowBar':'aboveBar',color:cc(m),shape:m.side==='CALL'?'arrowUp':'arrowDown',text:m.text}
        :{time:m.time,position:m.side==='CALL'?'aboveBar':'belowBar',color:m.text.includes('+')?G():R(),shape:'circle',text:m.text}));
    }else mk=st.markers.map(m=>({time:m.time,position:m.side==='CALL'?'belowBar':'aboveBar',color:cc(m),shape:m.side==='CALL'?'arrowUp':'arrowDown',text:m.text}));
    cs.setMarkers(mk.sort((a,b)=>a.time-b.time));
    // trade strip: the open trade, or the latest closed one, with the day total
    if(!T){tb.style.display='none'}
    else{
      tb.style.display='flex';
      const cur=T.trades.length?T.trades[T.trades.length-1]:null,pc=v=>(v>0?'+':'')+v.toFixed(1)+'%';
      if(!cur){tb.className='tr';tb.innerHTML=`<span>No trade yet</span><span class="k">the first setup becomes the trade · target +40% · stop −10% · no new trade after ${T.cutoff}</span>`}
      else{
        const chipT=t=>{const c=t.pnl_pct>=0?G():R(),ic=t.status==='TARGET'?'✔':t.status==='STOP'?'✖':t.status==='OPEN'?'▶':'■';
          return `<span style="border:1px solid ${c};color:${c};border-radius:8px;padding:0 10px;font-size:.82em;white-space:nowrap">${ic} T${t.n} ${t.side} ${t.strike} ${t.side==='CALL'?'CE':'PE'} on ${(t.level||'').replace(/ [0-9.]+ /,' ')} · ${t.entry_time} @ ${t.entry.toFixed(2)} → ${t.exit_time?t.exit_time+' @ '+t.exit.toFixed(2):'open'} · ${pc(t.pnl_pct)}</span>`};
        const prev=T.trades.slice(0,-1).map(chipT).join('');
        const open=cur.status==='OPEN',px=cur.exit!=null?cur.exit:cur.last,pnl=cur.pnl_pct,typ=cur.side==='CALL'?'CE':'PE';
        const head=open?`▶ TRADE ${cur.n} OPEN`:cur.status==='TARGET'?`✔ TRADE ${cur.n} TARGET HIT`:cur.status==='STOP'?`✖ TRADE ${cur.n} STOP HIT`:`■ TRADE ${cur.n} CLOSED (day end)`;
        tb.className='tr '+(pnl>=0?'win':'loss');
        tb.innerHTML=prev+`<span style="color:${cur.side==='CALL'?G():R()}">${head}</span><span>${cur.side} ${cur.strike} ${typ}</span><span><span class="k">in ${cur.entry_time} at</span>${cur.entry.toFixed(2)}</span>`+
          `<span><span class="k">target +40%</span>${cur.target.toFixed(2)}</span><span><span class="k">stop −10%</span>${cur.stop.toFixed(2)}</span>`+
          `<span><span class="k">${open?'now':'out '+cur.exit_time+' at'}</span>${px.toFixed(2)}</span><span class="big" style="color:${pnl>=0?G():R()}">${pc(pnl)}</span>`+
          `<span style="margin-left:auto"><span class="k">day total (${T.trades.length} trade${T.trades.length>1?'s':''})</span><span class="big" style="color:${T.total_pct>=0?G():R()}">${pc(T.total_pct)}</span></span>`}
    }
  }
  renderLevels(s);
}
async function poll(){try{const r=await fetch('/state.json',{cache:'no-store'});draw(await r.json())}catch(e){const c=document.getElementById('chip');c.textContent='no connection to the data feed';c.className='chip bad'}}
// countdown to the next NSE session from the NSE holiday calendar (served at /calendar.json): holidays, weekends and special sessions such as Muhurat trading
let CAL={holidays:{},special:{},pending:{}};
async function loadCal(){try{CAL=await (await fetch('/calendar.json',{cache:'no-store'})).json()}catch(e){}}
function istParts(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date()),o={};p.forEach(x=>o[x.type]=x.value);return o}
const nowIst=()=>{const o=istParts();return Date.UTC(+o.year,+o.month-1,+o.day,+o.hour,+o.minute,+o.second)};      // the IST wall clock written as a UTC time
const atTime=(key,t)=>Date.parse(key+'T'+t+':00Z');
function sessionsOn(ms){const d=new Date(ms),key=d.toISOString().slice(0,10),wd=(d.getUTCDay()+6)%7,sp=(CAL.special||{})[key];
  if(sp)return [{o:atTime(key,sp.open),c:atTime(key,sp.close),name:sp.name||'Special session'}];
  if(wd<5&&!(CAL.holidays||{})[key])return [{o:atTime(key,'09:15'),c:atTime(key,'15:30'),name:'NSE'}];
  return []}
function tickCountdown(){
  const now=nowIst(),box=document.getElementById('cd'),todayKey=new Date(now).toISOString().slice(0,10);
  let live=false,next=null;
  for(let i=0;i<15&&!next&&!live;i++){for(const s of sessionsOn(now+i*86400000)){if(now>=s.o&&now<s.c){live=true;break}if(s.o>now&&!next)next=s}}
  if(live||!next){box.style.display='none';return}
  const nd=new Date(next.o).toISOString().slice(0,10),sameDay=nd===todayKey,hol=(CAL.holidays||{})[todayKey],wd=(new Date(now).getUTCDay()+6)%7;
  const label=next.name==='NSE'?'':' ('+next.name+')';
  document.getElementById('cd-a').textContent=sameDay?(next.name==='NSE'?'NSE opens in':next.name+' opens in'):((hol&&wd<5?'NSE holiday ('+hol+'). ':'Market closed. ')+'Next session'+label+' in');
  const left=Math.max(0,Math.floor((next.o-now)/1000)),d=Math.floor(left/86400),h=Math.floor(left%86400/3600),m=Math.floor(left%3600/60),r=left%60,pad=n=>String(n).padStart(2,'0');
  document.getElementById('cd-t').textContent=(d>0?d+'D ':'')+pad(h)+':'+pad(m)+':'+pad(r);
  const pend=Object.keys(CAL.pending||{}).filter(k=>k>=todayKey).sort()[0];
  document.getElementById('cd-b').textContent=pend?(CAL.pending[pend]+' on '+new Date(pend+'T00:00:00Z').toUTCString().slice(0,11)):'Levels shown: end-of-day levels and the live GEX levels · the chart goes live when the session opens';
  box.style.display='block';
}
loadCal();setInterval(loadCal,3600000);
tickCountdown();setInterval(tickCountdown,1000);
applyTheme();poll();setInterval(poll,5000);
window.addEventListener('resize',()=>chart.applyOptions({layout:{fontSize:axisFont()}}));
</script>
</body>
</html>
