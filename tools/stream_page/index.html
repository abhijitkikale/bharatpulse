<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BharatPulse Live GEX and Volume</title>
<style>
:root{--bg:#0b0f16;--card:#111823;--line:#263040;--txt:#e6edf3;--mut:#8b97a8;--pos:#2ecc9a;--neg:#ef5b5b;
  --lw:clamp(310px,25vw,500px);--fs:clamp(13px,0.95vw,20px);--px:#1a2432}
:root[data-theme=light]{--bg:#ffffff;--card:#f3f5f8;--line:#d5dbe4;--txt:#111827;--mut:#5b6678;--pos:#0f8a5f;--neg:#d33f3f;--px:#e6ebf3}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,"Segoe UI",Arial,sans-serif;overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100vh}
.ban{flex:none;height:calc(var(--fs)*2.2);background:#3a2a05;color:#ffd27a;font-weight:700;font-size:calc(var(--fs)*1.1);overflow:hidden;white-space:nowrap;display:flex;align-items:center}
.ban span{display:inline-block;padding-left:100%;animation:mq 60s linear infinite}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.hd{flex:none;display:flex;align-items:baseline;gap:calc(var(--fs)*1.2);padding:calc(var(--fs)*.35) calc(var(--fs)*1);border-bottom:1px solid var(--line)}
.hd .t{font-size:calc(var(--fs)*1.6);font-weight:700}.hd .p{font-size:calc(var(--fs)*2);font-weight:700}.hd .m{color:var(--mut);font-size:calc(var(--fs)*1)}
.chip{margin-left:auto;font-size:calc(var(--fs)*1.05);padding:3px 12px;border-radius:12px;border:1px solid var(--line);color:var(--mut)}
.chip.btn{cursor:pointer;margin-left:10px;color:var(--txt)}
.chip.ok{color:var(--pos);border-color:var(--pos)}.chip.bad{color:var(--neg);border-color:var(--neg)}
.tr{flex:none;padding:calc(var(--fs)*.3) calc(var(--fs)*1);border-bottom:1px solid var(--line);font-size:calc(var(--fs)*1.15);font-weight:700;display:flex;gap:calc(var(--fs)*1.6);align-items:baseline;flex-wrap:wrap}
.tr.win{background:rgba(46,204,154,.16)}.tr.loss{background:rgba(239,91,91,.16)}.tr .k{color:var(--mut);font-weight:500;font-size:calc(var(--fs)*.85);margin-right:4px}.tr .big{font-size:calc(var(--fs)*1.5)}
.body{flex:1;display:flex;min-height:0}
.left{flex:none;width:var(--lw);box-sizing:border-box;border-right:1px solid var(--line);padding:calc(var(--fs)*.5);display:flex;flex-direction:column;gap:calc(var(--fs)*.5);overflow:hidden}
.main{flex:1;position:relative;min-width:0}
#cd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:calc(var(--fs)*1) calc(var(--fs)*3);display:none;box-shadow:0 8px 40px rgba(0,0,0,.25);pointer-events:none}
#cd .a{font-size:calc(var(--fs)*1.5);color:var(--mut);font-weight:600}#cd .t{font-size:calc(var(--fs)*5);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}#cd .b{font-size:calc(var(--fs)*1.05);color:var(--mut);margin-top:calc(var(--fs)*.3)}
#chart{position:absolute;left:0;top:0;right:0;bottom:0}
#regime{display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:calc(var(--fs)*.3) calc(var(--fs)*.8);font-size:calc(var(--fs)*1.35);font-weight:700;line-height:1.3}
.sg{flex:none;display:none;gap:calc(var(--fs)*.6);align-items:center;flex-wrap:wrap;padding:calc(var(--fs)*.25) calc(var(--fs)*1);border-bottom:1px solid var(--line);font-size:calc(var(--fs)*.92)}
.sg .h{color:var(--mut);font-weight:500}.sg .c{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 8px;white-space:nowrap}
#lv{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;font-size:calc(var(--fs)*.98)}
.row{display:flex;align-items:center;gap:6px;border-left:4px solid;padding:0 6px;font-weight:700;line-height:1.28;white-space:nowrap}
.row .n{flex:1;overflow:hidden;text-overflow:ellipsis}.row .v{font-variant-numeric:tabular-nums}.row .d{width:4.6em;text-align:right;font-weight:500;color:var(--mut);font-variant-numeric:tabular-nums}
.row.px{background:var(--px);border-left-color:var(--txt);color:var(--txt)}
#slpop{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.slp{background:#10202b;border:2px solid #ffb300;color:#ffe082;border-radius:12px;padding:10px 18px;font-weight:700;font-size:calc(var(--fs)*1.25);box-shadow:0 6px 24px #000a;animation:slin .35s ease-out;transition:opacity .8s}
.slp.nd{border-color:#7aa2ff;color:#cfe0ff;background:#0f1a2e}.slp small{display:block;font-weight:500;color:#cfd8e3;font-size:.8em;margin-top:2px}
@keyframes slin{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
#limitbar{flex:none;background:#5a1d1d;border-bottom:2px solid #ef5b5b;color:#ffd0d0;font-weight:700;font-size:calc(var(--fs)*1.2);padding:calc(var(--fs)*.35) calc(var(--fs)*1);text-align:center}
#orbs{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
#hm{position:absolute;left:8px;top:8px;z-index:4;pointer-events:none;display:none;transition:left .6s ease,top .6s ease,opacity .4s;background:rgba(11,15,22,.80);border:1px solid #263040;border-radius:8px;padding:4px 6px;font-size:calc(var(--fs)*.78);color:#c9d1d9}
#hm table{border-collapse:collapse}#hm th{font-weight:600;color:#8b97a8;padding:0 5px;text-align:center}#hm td{padding:0 5px;text-align:center;min-width:3.2em;color:#fff;text-shadow:0 0 3px #000}
#hm td.k{color:#c9d1d9;text-shadow:none;text-align:right;font-weight:600}#hm tr.sp td{outline:1px solid #ffffff99;outline-offset:-1px}#hm .cap{font-size:.85em;color:#8b97a8;margin-bottom:2px}
.gd{display:inline-block;min-width:1.5em;text-align:center;border-radius:5px;padding:0 4px;margin-left:5px;font-size:.9em;color:#0b0f16}.gA{background:#2ecc9a}.gB{background:#ffb300}.gC{background:#8b97a8}
.tr.one{flex-wrap:nowrap;white-space:nowrap;overflow:hidden;gap:calc(var(--fs)*1);font-size:calc(var(--fs)*1);align-items:center;padding:calc(var(--fs)*.2) calc(var(--fs)*.8)}
.tr.one .pill{border:1px solid;border-radius:8px;padding:0 7px;font-size:.88em;font-weight:700}.tr.one .sep{color:var(--line)}.tr.one .big{font-size:1.25em}
#tip{position:absolute;display:none;z-index:6;pointer-events:none;max-width:420px;background:rgba(11,15,22,.94);border:1px solid #3a4a60;border-radius:8px;padding:6px 10px;color:#e8eaed;font-size:calc(var(--fs)*.85);line-height:1.35}
#tip .r{color:#9fb0c4;font-weight:400}
</style>
</head>
<body>
<div id="slpop"></div>
<div class="wrap">
  <div class="ban"><span id="b1"></span></div>
  <div class="hd"><span class="t">NIFTY 50 · 1 min</span><span class="p" id="px">–</span><span class="m" id="meta"></span><span class="chip" id="chip">connecting…</span><span class="chip btn" id="th" title="Light / dark background">☀ Light</span></div>
  <div id="limitbar" style="display:none"></div>
  <div class="tr" id="trade" style="display:none"></div>
  <div class="body">
    <div class="left"><div id="regime"><div id="r1"></div><div id="r2"></div></div><div id="lv"></div></div>
    <div class="main"><div id="chart"></div><canvas id="orbs"></canvas><div id="hm"></div><div id="tip"></div><div id="cd"><div class="a" id="cd-a"></div><div class="t" id="cd-t"></div><div class="b" id="cd-b"></div></div></div>
  </div>
  <div class="ban"><span id="b2"></span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const TXT='NOT SEBI REGISTERED  ·  THIS IS NOT FINANCIAL ADVICE OR A RECOMMENDATION TO BUY OR SELL  ·  Gamma exposure (GEX) and volume-profile data shown for education only, so the numbers can be read and interpreted by each viewer  ·  Data may be delayed or wrong  ·  Trade at your own risk and consult a SEBI-registered adviser  ·  ';
document.getElementById('b1').textContent=TXT+TXT;document.getElementById('b2').textContent=TXT+TXT;

const qs=new URLSearchParams(location.search);
let THEME=qs.get('theme')||(()=>{try{return localStorage.getItem('bp_theme')}catch(e){return null}})()||'light';if(THEME!=='dark')THEME='light';
const LIGHT={'#ffeb3b':'#c79100','#18ffff':'#0097a7','#ff80ab':'#d81b60','#80cbc4':'#00796b','#d4e157':'#827717','#f5a623':'#e65100','#ef5b5b':'#c62828','#2ecc9a':'#2e7d32','#ff9f6b':'#e64a19','#66c2ff':'#0277bd','#e8c547':'#b8860b','#b388ff':'#6a1b9a'};
const G=()=>THEME==='light'?'#0f8a5f':'#2ecc9a',R=()=>THEME==='light'?'#d33f3f':'#ef5b5b';
const el=document.getElementById('chart');
const axisFont=()=>Math.round(Math.max(13,window.innerWidth*0.0098));
const chart=LightweightCharts.createChart(el,{layout:{background:{color:'#0b0f16'},textColor:'#c9d1d9',fontSize:axisFont()},grid:{vertLines:{color:'#141c28'},horzLines:{color:'#141c28'}},
  rightPriceScale:{borderColor:'#263040',scaleMargins:{top:0.03,bottom:0.03}},timeScale:{borderColor:'#263040',timeVisible:true,secondsVisible:false,rightOffset:6},crosshair:{mode:0},handleScroll:false,handleScale:false,autoSize:true});
const cs=chart.addCandlestickSeries({upColor:'#2ecc9a',downColor:'#ef5b5b',borderVisible:false,wickUpColor:'#2ecc9a',wickDownColor:'#ef5b5b'});
const vd=chart.addLineSeries({color:'#18ffff',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,autoscaleInfoProvider:()=>null});
const vw=chart.addLineSeries({color:'#ffeb3b',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,autoscaleInfoProvider:()=>null});
const CLEAN=new URLSearchParams(location.search).get('clean')==='1';if(CLEAN)document.getElementById('th').style.display='none';   // /?clean=1 : no setups table or CALL / PUT markers (for OBS)
let lines=[],RANGE=null,LASTS=null;
function applyTheme(){
  const L=THEME==='light';document.documentElement.dataset.theme=THEME;
  chart.applyOptions({layout:{background:{color:L?'#ffffff':'#0b0f16'},textColor:L?'#1f2937':'#c9d1d9'},grid:{vertLines:{color:L?'#eef1f5':'#141c28'},horzLines:{color:L?'#eef1f5':'#141c28'}},
    rightPriceScale:{borderColor:L?'#c9d1dc':'#263040'},timeScale:{borderColor:L?'#c9d1dc':'#263040'}});
  cs.applyOptions({upColor:G(),downColor:R(),wickUpColor:G(),wickDownColor:R()});
  vd.applyOptions({color:color({name:'Now VWAP',kind:'now'})});vw.applyOptions({color:color({name:'Now Weekly VWAP',kind:'now'})});
  document.getElementById('th').textContent=L?'☀ Light':'☾ Dark';
}
document.getElementById('th').onclick=()=>{THEME=THEME==='light'?'dark':'light';try{localStorage.setItem('bp_theme',THEME)}catch(e){}applyTheme();if(LASTS)draw(LASTS)};

// the price axis follows the day's high and low only, so the candles fill the screen; every level is listed in the table on the left
function dayRange(s){
  const day=s.date,c_=s.candles.filter(c=>new Date(c.time*1000).toISOString().slice(0,10)===day);
  const arr=c_.length?c_:s.candles,lo=Math.min(...arr.map(c=>c.low)),hi=Math.max(...arr.map(c=>c.high)),pad=0.03*Math.max(hi-lo,1);
  return {lo:lo-pad,hi:hi+pad}}
cs.applyOptions({autoscaleInfoProvider:()=>RANGE?{priceRange:{minValue:RANGE.lo,maxValue:RANGE.hi}}:null});

// colours and line styles by level name (same scheme as the TradingView indicator)
function color(l){const c=baseColor(l);return THEME==='light'?(LIGHT[c]||c):c}
function baseColor(l){const s=l.name.toLowerCase();
  if(s==='now weekly vwap')return '#ffeb3b';
  if(l.kind==='live'||l.kind==='now')return '#18ffff';
  if(s.includes('weekly')&&s.includes('poc'))return '#ff80ab';
  if(s.includes('weekly'))return '#80cbc4';
  if(s.includes('max pain'))return '#d4e157';if(s.includes('flip'))return '#f5a623';
  if(s.includes('oi call'))return '#ef5b5b';if(s.includes('oi put'))return '#2ecc9a';
  if(s.includes('gex call'))return '#ff9f6b';if(s.includes('gex put'))return '#66c2ff';
  if(s.includes('poc'))return '#e8c547';return '#b388ff'}
function style(l){const s=l.name.toLowerCase();
  if(s.includes('poc'))return 0;if(s.includes('weekly'))return 1;if(s.includes('max pain')||s.includes('flip'))return 1;return 2}

function renderLevels(s){
  const t=s.regime&&s.regime.now_time,rows=(s.levels||[]).slice();
  rows.push({name:'PRICE',value:s.last,kind:'px'});
  rows.sort((a,b)=>b.value-a.value);
  document.getElementById('lv').innerHTML=rows.map(l=>{
    if(l.kind==='px')return `<div class="row px"><span class="n">▶ Price</span><span class="v">${l.value.toFixed(2)}</span><span class="d"></span></div>`;
    const d=l.value-s.last,c=color(l),tag=l.kind==='live'&&t?` <span style="color:var(--mut);font-weight:500">${t}</span>`:'';
    return `<div class="row" style="border-left-color:${c};color:${c}"><span class="n">${l.name}${tag}</span><span class="v">${l.value.toFixed(2)}</span><span class="d">${d>0?'+':''}${d.toFixed(0)}</span></div>`}).join('');
}
// pop-up at the top when a trade's trailing stop moves up (not for shifts already there when the page was opened)
let SEEN=null;
function slPop(t,x){
  const box=document.getElementById('slpop'),d=document.createElement('div');d.className='slp';
  const why=x.why?`${x.why} against your ${t.side} · profit locked`:`premium reached +${x.reach}%`,lk=(x.lock>=0?'+':'−')+Math.abs(x.lock)+'%';
  d.innerHTML=`🔒 TRADE ${t.n} · STOP-LOSS MOVED UP to ${lk} (${x.stop.toFixed(2)})<small>${t.side} ${t.strike} ${t.side==='CALL'?'CE':'PE'} · ${why} · ${x.when}</small>`;
  box.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),900)},15000);
}
function slCheck(T){
  if(!T)return;
  const all=[];T.trades.forEach(t=>(t.shifts||[]).forEach(x=>all.push({k:t.n+'@'+x.when+'@'+x.lock,t,x})));
  if(SEEN===null){SEEN=new Set(all.map(o=>o.k));return}
  all.forEach(o=>{if(!SEEN.has(o.k)){SEEN.add(o.k);slPop(o.t,o.x)}});
}
function draw(s){
  LASTS=s;
  const LV=s.levels||[];
  const ok=s.candles&&s.candles.length;
  document.getElementById('px').textContent=ok?s.last.toFixed(2):'–';
  const age=s.asof?(Date.now()-Date.parse(s.asof))/1000:1e9;
  const chip=document.getElementById('chip');
  const live=s.status==='live';
  chip.textContent=live?(age>120?'DATA STALE':'LIVE · candle '+s.last_candle+' IST'):(s.status||'waiting');
  chip.className='chip '+(live&&age<=120?'ok':(live?'bad':''));
  document.getElementById('meta').textContent=(s.eod_close?'end-of-day levels from the '+s.eod_close+' close':'')+(s.replay_eod?' · today\'s trades use the levels of the '+s.replay_eod+' close':'')+(s.open_src?' · opening candles: TradingView ('+s.open_src+')':'');
  if(!ok)return;
  RANGE=dayRange(s);
  cs.setData(s.candles);vd.setData(s.vwap.daily);vw.setData(s.vwap.weekly);
  lines.forEach(p=>cs.removePriceLine(p));
  lines=LV.map(l=>cs.createPriceLine({price:l.value,color:color(l),lineWidth:l.kind==='eod'?1:2,lineStyle:style(l),axisLabelVisible:false,title:''}));
  // today's candles, with only a few of the day before, so they fill the width
  const day=s.date;let i0=s.candles.findIndex(c=>new Date(c.time*1000).toISOString().slice(0,10)===day);if(i0<0)i0=0;
  chart.timeScale().setVisibleLogicalRange({from:Math.max(i0-3,0),to:s.candles.length+8});
  chart.priceScale('right').applyOptions({autoScale:true});
  // regime box
  const r=s.regime||{},box=document.getElementById('regime');
  const col=v=>v==='POSITIVE'?G():R();
  if(r.eod||r.now){box.style.display='block';
    document.getElementById('r1').innerHTML=r.eod?`<span style="color:${col(r.eod)}">EOD: ${r.eod} gamma</span>`:'';
    document.getElementById('r2').innerHTML=r.now?`<span style="color:${col(r.now)}">NOW: ${r.now} gamma${r.now_time?' ('+r.now_time+')':''}</span>`:''}
  else box.style.display='none';
  // CALL / PUT setups: markers on the chart (grade letter on each), details in the hover card; one-line trade strip on top. Not shown on the clean address.
  const st=s.setups||{table:[],markers:[]};
  const T=s.trades,tb=document.getElementById('trade');slCheck(T);{const lb=document.getElementById('limitbar');if(T&&T.limit){lb.style.display='block';lb.textContent='⛔ '+T.limit}else lb.style.display='none'}
  if(CLEAN){MARKS=[];cs.setMarkers([]);tb.style.display='none'}
  else{
    const cc=x=>x.side==='CALL'?G():R();
    const sigAt={};if(T)T.signals.forEach(x=>{sigAt[x.time+'|'+x.side]=x});
    const gl=(time,side)=>{const x=sigAt[time+'|'+side],g=x&&GR[x.when+'|'+x.side];return g?' '+g.grade:''};
    let mk=[];
    if(T){
      T.signals.filter(x=>!x.status.startsWith('TRADE')).forEach(x=>mk.push({time:x.time,position:x.side==='CALL'?'belowBar':'aboveBar',color:'#8b97a8',shape:x.side==='CALL'?'arrowUp':'arrowDown',text:(gl(x.time,x.side)||'').trim()}));
      T.markers.forEach(m=>mk.push(m.kind==='entry'?{time:m.time,position:m.side==='CALL'?'belowBar':'aboveBar',color:cc(m),shape:m.side==='CALL'?'arrowUp':'arrowDown',text:m.text+gl(m.time,m.side)}
        :m.kind==='shift'?{time:m.time,position:m.side==='CALL'?'aboveBar':'belowBar',color:'#ffb300',shape:'square',text:m.text}
        :{time:m.time,position:m.side==='CALL'?'aboveBar':'belowBar',color:m.text.includes('+')?G():R(),shape:'circle',text:m.text}));
    }else mk=st.markers.map(m=>({time:m.time,position:m.side==='CALL'?'belowBar':'aboveBar',color:cc(m),shape:m.side==='CALL'?'arrowUp':'arrowDown',text:m.text}));
    MARKS=mk.map(m=>({time:m.time,position:m.position==='aboveBar'?'above':'below',color:m.color,text:m.text||'',shape:m.shape}));
    cs.setMarkers(mk.map(m=>({...m,text:''})).sort((a,b)=>a.time-b.time));
    // one-line trade strip: past trades as small pills, the open (or latest) trade, the day total
    if(!T){tb.style.display='none'}
    else{
      tb.style.display='flex';
      const cur=T.trades.length?T.trades[T.trades.length-1]:null,pc=v=>(v>0?'+':'')+v.toFixed(1)+'%',mx=T.max_trades||5;
      const rules='Until 13:00: target +40%, stop −10%, trailing +20%→+5%, +30%→+15%, +35%→+30%. From 13:00: target +20%, stop −7%, trailing +10%→+5%, +15%→+10%. No trade before 9:25, none after '+T.cutoff+'. Max '+mx+' trades a day.';
      const sk=[...new Set((T.signals||[]).filter(x=>x.would).map(x=>`${x.when} ${x.side} ${x.would.pnl_pct>0?'+':''}${x.would.pnl_pct.toFixed(1)}%`))].slice(-2).join(' · ');
      const skTxt=sk?`<span class="k" style="font-size:.62em;opacity:.8" title="Testing: setups that were not taken, and what each would have returned with the same stop, target and trailing rules">skipped, if taken (testing): ${sk}</span>`:'';
      tb.title=rules;
      if(!cur){tb.className='tr one';tb.innerHTML=`<span>No trade yet</span><span class="k">first setup from 9:25 · max ${mx} trades a day · hover the strip for the rules</span>`}
      else{
        const ic=t=>t.status==='TARGET'||t.status==='TRAIL'?'✔':t.status==='STOP'?'✖':t.status==='OPEN'?'▶':'■';
        const pill=t=>{const c=t.pnl_pct>=0?G():R();
          return `<span class="pill" style="color:${c};border-color:${c}" title="T${t.n} ${t.side} ${t.strike} ${t.side==='CALL'?'CE':'PE'} on ${(t.level||'').replace(/ [0-9.]+ /,' ')} · ${t.entry_time} @ ${t.entry.toFixed(2)} → ${t.exit_time?t.exit_time+' @ '+t.exit.toFixed(2):'open'} · ${t.status}">${ic(t)} T${t.n} ${pc(t.pnl_pct)}</span>`};
        const prev=T.trades.slice(0,-1).map(pill).join('');
        const open=cur.status==='OPEN',px=cur.exit!=null?cur.exit:cur.last,pnl=cur.pnl_pct,typ=cur.side==='CALL'?'CE':'PE';
        const sn=cur.stop_now!=null?cur.stop_now:cur.stop,sq=(sn/cur.entry-1)*100,tq=Math.round((cur.target/cur.entry-1)*100);
        const word=open?'OPEN':cur.status==='TARGET'?'TARGET HIT':cur.status==='STOP'?'STOP HIT':cur.status==='TRAIL'?'TRAILING STOP HIT':'CLOSED (day end)';
        tb.className='tr one '+(pnl>=0?'win':'loss');
        tb.innerHTML=prev+(prev?'<span class="sep">│</span>':'')+
          `<span style="color:${cur.side==='CALL'?G():R()};font-weight:800">${ic(cur)} T${cur.n} ${word}${gb(cur.entry_time,cur.side)}</span><span>${cur.side} ${cur.strike} ${typ}</span>`+
          `<span><span class="k">in</span>${cur.entry.toFixed(2)} <span class="k">${open?'now':'out '+cur.exit_time}</span>${px.toFixed(2)}</span>`+
          `<span><span class="k">stop ${(sq>=0?'+':'−')+Math.abs(sq).toFixed(0)}%</span>${sn.toFixed(2)} <span class="k">target +${tq}%</span>${cur.target.toFixed(2)}</span>`+
          `<span class="big" style="color:${pnl>=0?G():R()}">${pc(pnl)}</span>`+
          skTxt+`<span style="margin-left:auto"><span class="k">day · ${T.trades.length} of ${mx} trades</span><span class="big" style="color:${T.total_pct>=0?G():R()}">${pc(T.total_pct)}</span></span>`}

  }

}
// ---- nodes layer: tools/nodes_agent.py writes data/nodes/latest.json (served as /nodes.json); this page only draws it. /?nodes=0 hides it ----
const NODES_ON=new URLSearchParams(location.search).get('nodes')!=='0';
let NODES=null,GR={};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nodeFresh=()=>NODES&&NODES.asof&&(Date.now()-Date.parse(NODES.asof))<300000;
const gb=(when,side)=>{const g=GR[when+'|'+side];return g?` <b class="gd g${g.grade}" title="${g.reasons.join('; ').replace(/"/g,'&quot;')}${g.late?' (graded late)':''}">${g.grade}</b>`:''};
const nodeRole=n=>{const r=n.roles||[];return r.includes('king')?'KING':r.includes('gatekeeper')?'GATE':r.includes('ceiling')?'CEIL':r.includes('floor')?'FLOOR':r.includes('pika')?'+':r.includes('barney')?'−':''};
const nodeArrow=n=>n.v5==null?'':n.v5>=3?' ▲':n.v5<=-3?' ▼':'';
const nodeCol=(sign,a)=>sign==='+'?`rgba(255,213,79,${a})`:`rgba(179,136,255,${a})`;
// node alerts: a pop-up when price comes within 15 points of a key node (approach) or touches it (tap); re-armed once price is 40 points away. Not shown for what is already true when the page opens.
let NSTATE=null;
function nodePop(txt,sub){
  const box=document.getElementById('slpop'),d=document.createElement('div');d.className='slp nd';d.innerHTML=`${txt}<small>${sub}</small>`;box.appendChild(d);
  setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),900)},15000);
}
function nodeAlerts(){
  if(!NODES||!LASTS||!LASTS.last)return;
  const px=LASTS.last,key=NODES.nodes.filter(n=>(n.roles||[]).some(r=>r==='king'||r==='gatekeeper'||r==='ceiling'||r==='floor')||n.pct>=40);
  const first=NSTATE===null;if(first)NSTATE={};
  key.forEach(n=>{
    const d=Math.abs(px-n.k),st=NSTATE[n.k]||'far';let nx=st;
    if(d<=5)nx='tap';else if(d<=15)nx=st==='tap'?'tap':'near';else if(d>40)nx='far';else if(st==='tap')nx='near';
    if(!first&&nx!==st){
      const role=({KING:'King',GATE:'gatekeeper',CEIL:'ceiling',FLOOR:'floor'})[nodeRole(n)]||'node',how=n.fresh?'fresh, not touched today':'touched '+n.touches+'x today';
      if(nx==='tap')nodePop(`📍 Price tapped the ${n.k.toFixed(0)} ${role} node`,`${Math.round(n.pct)}% of King · ${how}`);
      else if(nx==='near'&&st==='far')nodePop(`🎯 Price approaching the ${n.k.toFixed(0)} ${role} node`,`${d.toFixed(0)} points away · ${Math.round(n.pct)}% of King · ${how}`);
    }
    NSTATE[n.k]=nx;
  });
}
let MARKS=[],HMI=-1,HMCOMPACT=false;
// marker labels: drawn on the overlay so they never sit on top of each other (pushed up or down, with a thin line back to their candle)
function drawMarks(g,w,h,obst){
  if(CLEAN||!MARKS.length||!LASTS||!LASTS.candles)return;
  const byT=new Map(LASTS.candles.map(c=>[c.time,c])),fs=Math.round(axisFont()*.72),step=fs+5;
  g.font=`700 ${fs}px sans-serif`;g.textBaseline='middle';g.textAlign='left';
  const grp={};MARKS.forEach(m=>{if(!m.text)return;const k=m.time+'|'+m.position;(grp[k]=grp[k]||{time:m.time,position:m.position,items:[]}).items.push(m)});
  const items=[];
  Object.values(grp).forEach(q=>{
    const c=byT.get(q.time);if(!c)return;const x=chart.timeScale().timeToCoordinate(q.time);if(x==null||x<0||x>w)return;
    const yb=cs.priceToCoordinate(q.position==='above'?c.high:c.low);if(yb==null)return;
    items.push({x,yb,above:q.position==='above',text:q.items.map(i=>i.text).join(' · '),color:q.items[0].color});
  });
  items.sort((a,b)=>a.x-b.x);
  const placed=[],hit=(r)=>placed.some(o=>o[0]<r[2]&&o[2]>r[0]&&o[1]<r[3]&&o[3]>r[1]);
  items.forEach(it=>{
    const tw=g.measureText(it.text).width,x0=it.x+9;
    let y=it.yb+(it.above?-16:16),r,tries=0;
    do{r=[x0-2,y-fs/2-2,x0+tw+2,y+fs/2+2];if(!hit(r))break;y+=it.above?-step:step;tries++}while(tries<8);
    placed.push(r);obst.push(r);
    if(Math.abs(y-it.yb)>22){g.beginPath();g.moveTo(it.x,it.yb);g.lineTo(x0-2,y);g.lineWidth=1;g.strokeStyle=it.color;g.globalAlpha=.55;g.stroke();g.globalAlpha=1}
    g.lineWidth=3.5;g.strokeStyle='rgba(11,15,22,.9)';g.strokeText(it.text,x0,y);g.fillStyle=it.color;g.fillText(it.text,x0,y);
  });
}
// the heatmap panel floats to the emptiest corner or edge of the chart (fewest candles and labels under it) and only moves when another spot is clearly emptier
function placeHeat(hm,w,h,obst){
  const pw=hm.offsetWidth,ph=hm.offsetHeight;if(!pw||!LASTS)return;
  const W=w-chart.priceScale('right').width(),H=h-chart.timeScale().height(),m=8;
  const NX=6,NY=5,cands=[];
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++)cands.push({x:Math.max(0,m+(W-pw-2*m)*i/(NX-1)),y:Math.max(0,m+(H-ph-2*m)*j/(NY-1)),corner:(i==0||i==NX-1)&&(j==0||j==NY-1)});
  cands.sort((a,b)=>(b.corner?1:0)-(a.corner?1:0));         // corners first, so they win a tie
  const rects=[];
  (LASTS.candles||[]).forEach(c=>{const x=chart.timeScale().timeToCoordinate(c.time);if(x==null||x<0||x>W)return;
    const y1=cs.priceToCoordinate(c.high),y2=cs.priceToCoordinate(c.low);if(y1==null||y2==null)return;rects.push([x-1.5,Math.min(y1,y2),x+1.5,Math.max(y1,y2),1])});
  obst.forEach(r=>rects.push([r[0],r[1],r[2],r[3],12]));
  const score=p=>{let s=0;rects.forEach(r=>{if(r[0]<p.x+pw&&r[2]>p.x&&r[1]<p.y+ph&&r[3]>p.y)s+=r[4]});return s};
  const sc=cands.map(score);let best=0;sc.forEach((v,i)=>{if(v<sc[best])best=i});
  if(HMI<0||sc[best]+6<sc[HMI])HMI=best;
  if(sc[HMI]>0&&!HMCOMPACT){HMCOMPACT=true;drawHeat(hm);return placeHeat(hm,w,h,obst)}      // still covering something: shrink to 9 strikes and look again
  hm.style.left=cands[HMI].x+'px';hm.style.top=cands[HMI].y+'px';hm.style.opacity=sc[HMI]>0?'.6':'.95';
}
function drawNodes(){
  const cv=document.getElementById('orbs'),hm=document.getElementById('hm');if(!cv)return;
  const w=el.clientWidth,h=el.clientHeight,dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.width=w+'px';cv.style.height=h+'px'}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  const obst=[];
  drawMarks(g,w,h,obst);
  if(!NODES_ON||!nodeFresh()||!NODES.nodes){hm.style.display='none';return}
  const sc=Math.max(.7,Math.min(1.4,w/1300)),x0=w-chart.priceScale('right').width()-30*sc;
  g.font=`600 ${Math.round(axisFont()*.85)}px sans-serif`;g.textBaseline='middle';
  nodeAlerts();
  const ex=NODES.expected;                                  // the day's priced move (1 and 2 sigma around the previous close): fixed dotted lines
  if(ex){const Wp=w-chart.priceScale('right').width();g.save();g.setLineDash([2,5]);g.lineWidth=1.2;g.textAlign='left';g.font=`600 ${Math.round(axisFont()*.7)}px sans-serif`;
    [['+2σ',ex.up2],['+1σ',ex.up1],['−1σ',ex.dn1],['−2σ',ex.dn2]].forEach(([lb,v])=>{const y=cs.priceToCoordinate(v);if(y==null||y<0||y>h)return;
      g.strokeStyle='rgba(122,162,255,.55)';g.beginPath();g.moveTo(0,y);g.lineTo(Wp,y);g.stroke();g.fillStyle='rgba(150,180,255,.95)';g.fillText(`${lb} ${v.toFixed(0)} (day)`,6,y-7)});
    g.restore()}
  NODES.nodes.slice(0,7).forEach(n=>{
    const y=cs.priceToCoordinate(n.k);if(y==null||y<0||y>h)return;
    const r=(7+17*Math.sqrt(n.pct/100))*sc,king=(n.roles||[]).includes('king');
    g.beginPath();g.arc(x0,y,r,0,6.283);g.fillStyle=nodeCol(n.sign,.55);g.fill();g.lineWidth=king?3:1.5;g.strokeStyle=king?'#ffffff':nodeCol(n.sign,.95);g.stroke();
    if(king){g.fillStyle='#0b0f16';g.textAlign='center';g.fillText('★',x0,y+1)}
    const role=nodeRole(n),txt=`${n.k.toFixed(0)} · ${Math.round(n.pct)}%${role?' · '+role:''}${(n.flags||[]).includes('decoy')?' (far)':''}${nodeArrow(n)}${n.fresh?'':' ·'+n.touches+'x'}`;
    g.textAlign='right';g.lineWidth=4;g.strokeStyle='rgba(11,15,22,.85)';g.strokeText(txt,x0-r-8,y);g.fillStyle=nodeCol(n.sign,1);g.fillText(txt,x0-r-8,y);
    const tw=g.measureText(txt).width;obst.push([x0-r-8-tw,y-9,x0+r,y+9]);
  });
  drawHeat(hm);
  placeHeat(hm,w,h,obst);
}
function drawHeat(hm){
  const narrow=el.clientWidth<700,cols=(NODES.columns||[]).slice(0,narrow?2:4);if(!cols.length||!cols[0].strikes.length){hm.style.display='none';return}
  const spot=NODES.spot,all=cols[0].strikes.map(r=>r.k).sort((a,b)=>b-a);
  let ci=0;all.forEach((k,i)=>{if(Math.abs(k-spot)<Math.abs(all[ci]-spot))ci=i});
  const rr=narrow||HMCOMPACT?4:7,ks=all.slice(Math.max(0,ci-rr),ci+rr+1),near=all[ci];
  const val=(c,k)=>{const r=c.strikes.find(x=>x.k===k);return r||null};
  let html=`<div class="cap">Gamma nodes · ${NODES.regime.now==='NEGATIVE'?'negative':'positive'} regime${NODES.expected?' · day moved '+(NODES.expected.pace>=0?'+':'−')+Math.abs(NODES.expected.pace).toFixed(1)+'σ of ±'+Math.round(NODES.expected.sigma):(NODES.exp_move?' · exp. move ±'+Math.round(NODES.exp_move):'')}</div><table><tr><th></th>`+cols.map(c=>`<th>${+c.expiry.slice(8)} ${MON[+c.expiry.slice(5,7)-1]}</th>`).join('')+'</tr>';
  ks.forEach(k=>{html+=`<tr${k===near?' class="sp"':''}><td class="k">${k.toFixed(0)}</td>`+cols.map(c=>{const r=val(c,k);if(!r)return'<td></td>';const a=.1+.8*r.pct/100;
    return `<td style="background:${nodeCol(r.net>=0?'+':'-',a.toFixed(2))}">${r.pct>=25?Math.round(r.pct)+(c.king===k?'★':''):''}</td>`}).join('')+'</tr>'});
  hm.innerHTML=html+'</table>';hm.style.display='block';
}
// hover card: hover a candle that has a setup marker to see the setup, its status, grade and reasons (and any stop moves)
const TIP=document.getElementById('tip');
chart.subscribeCrosshairMove(p=>{
  const T=LASTS&&LASTS.trades;
  if(CLEAN||!T||!p||!p.time||!p.point){TIP.style.display='none';return}
  const sg=T.signals.filter(x=>Math.abs(x.time-p.time)<=30),sh=[];
  T.trades.forEach(t=>(t.shifts||[]).forEach(x=>{if(Math.abs(x.time-p.time)<=30)sh.push(`T${t.n} stop moved to ${x.lock>=0?'+':'−'}${Math.abs(x.lock)}% (${x.stop.toFixed(2)}) · ${x.why||'premium reached +'+x.reach+'%'}`)}));
  if(!sg.length&&!sh.length){TIP.style.display='none';return}
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let h='';
  sg.forEach(x=>{const g=GR[x.when+'|'+x.side];
    h+=`<div><b style="color:${x.side==='CALL'?G():R()}">${x.when} ${x.side} ${x.strike}</b> · ${esc(x.level)}<br><span class="r">${esc(x.status)}</span>`+(x.would?`<br><span class="r" style="font-size:.78em">testing · if taken: ${x.would.pnl_pct>0?'+':''}${x.would.pnl_pct.toFixed(1)}% (${esc(x.would.status)}${x.would.exit_time?' '+x.would.exit_time:''})</span>`:'')+(g?`<br>Grade <b>${g.grade}</b> (${g.score>=0?'+':''}${g.score})${g.late?' · graded late':''}<br><span class="r">${g.reasons.map(esc).join('<br>')||'no reasons: nothing nearby, no penalty'}</span>`:'')+'</div>'});
  sh.forEach(t=>{h+=`<div>🔒 ${esc(t)}</div>`});
  TIP.innerHTML=h;TIP.style.display='block';
  const W=el.clientWidth,Hh=el.clientHeight,w=TIP.offsetWidth,hh=TIP.offsetHeight;
  TIP.style.left=Math.max(4,Math.min(W-w-4,p.point.x+14))+'px';TIP.style.top=Math.max(4,Math.min(Hh-hh-4,p.point.y+14))+'px';
});
async function pollNodes(){
  try{const r=await fetch('/nodes.json',{cache:'no-store'});const j=await r.json();NODES=j&&j.asof?j:null}catch(e){NODES=null}
  GR={};((NODES&&NODES.grades)||[]).forEach(x=>{if(!GR[x.when+'|'+x.side])GR[x.when+'|'+x.side]=x});
  if(LASTS)draw(LASTS);else drawNodes();
}
async function poll(){try{const r=await fetch('/state.json',{cache:'no-store'});draw(await r.json())}catch(e){const c=document.getElementById('chip');c.textContent='no connection to the data feed';c.className='chip bad'}}
// countdown to the next NSE session from the NSE holiday calendar (served at /calendar.json): holidays, weekends and special sessions such as Muhurat trading
let CAL={holidays:{},special:{},pending:{}};
async function loadCal(){try{CAL=await (await fetch('/calendar.json',{cache:'no-store'})).json()}catch(e){}}
function istParts(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date()),o={};p.forEach(x=>o[x.type]=x.value);return o}
const nowIst=()=>{const o=istParts();return Date.UTC(+o.year,+o.month-1,+o.day,+o.hour,+o.minute,+o.second)};      // the IST wall clock written as a UTC time
const atTime=(key,t)=>Date.parse(key+'T'+t+':00Z');
function sessionsOn(ms){const d=new Date(ms),key=d.toISOString().slice(0,10),wd=(d.getUTCDay()+6)%7,sp=(CAL.special||{})[key];
  if(sp)return [{o:atTime(key,sp.open),c:atTime(key,sp.close),name:sp.name||'Special session'}];
  if(wd<5&&!(CAL.holidays||{})[key])return [{o:atTime(key,'09:15'),c:atTime(key,'15:30'),name:'NSE'}];
  return []}
function tickCountdown(){
  const now=nowIst(),box=document.getElementById('cd'),todayKey=new Date(now).toISOString().slice(0,10);
  let live=false,next=null;
  for(let i=0;i<15&&!next&&!live;i++){for(const s of sessionsOn(now+i*86400000)){if(now>=s.o&&now<s.c){live=true;break}if(s.o>now&&!next)next=s}}
  if(live||!next){box.style.display='none';return}
  const nd=new Date(next.o).toISOString().slice(0,10),sameDay=nd===todayKey,hol=(CAL.holidays||{})[todayKey],wd=(new Date(now).getUTCDay()+6)%7;
  const label=next.name==='NSE'?'':' ('+next.name+')';
  document.getElementById('cd-a').textContent=sameDay?(next.name==='NSE'?'NSE opens in':next.name+' opens in'):((hol&&wd<5?'NSE holiday ('+hol+'). ':'Market closed. ')+'Next session'+label+' in');
  const left=Math.max(0,Math.floor((next.o-now)/1000)),d=Math.floor(left/86400),h=Math.floor(left%86400/3600),m=Math.floor(left%3600/60),r=left%60,pad=n=>String(n).padStart(2,'0');
  document.getElementById('cd-t').textContent=(d>0?d+'D ':'')+pad(h)+':'+pad(m)+':'+pad(r);
  const pend=Object.keys(CAL.pending||{}).filter(k=>k>=todayKey).sort()[0];
  document.getElementById('cd-b').textContent=pend?(CAL.pending[pend]+' on '+new Date(pend+'T00:00:00Z').toUTCString().slice(0,11)):'Levels shown: end-of-day levels and the live GEX levels · the chart goes live when the session opens';
  box.style.display='block';
}
