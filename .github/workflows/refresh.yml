name: Refresh BharatPulse

on:
  schedule:
    - cron: "30 13 * * 1-5"      # 19:00 IST (UTC+5:30), Monday-Friday
  workflow_dispatch: {}          # manual run button; no other triggers (no PR / fork input)

concurrency:
  group: refresh
  cancel-in-progress: false

permissions: {}                  # deny by default; each job asks for only what it needs

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write            # only to commit history CSVs under data/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --no-input -r requirements.txt
      - run: python -m pytest tests -q
      - name: Restore price/index caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: |
            data/idx
            data/stock_prices.pkl
            data/mcap.json
            data/feps.json
            data/fo
            data/fo_part
            data/global.pkl
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Fetch data and build dashboard
        working-directory: pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional; scoped to this step only
        run: python run.py
      - name: Stage site
        run: |
          mkdir _site
          cp dashboard.html _site/index.html
      - name: Commit history files
        run: |
          git config user.name "bharatpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fiidii.csv data/fwd_pe.csv data/hy_oas.csv data/move.csv
          git diff --cached --quiet || (git commit -m "Update history files" && git push)
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
